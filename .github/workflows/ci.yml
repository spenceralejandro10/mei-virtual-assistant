name: Mei CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Validate required files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s manifest.webmanifest
          test -s assets/mei-icon.svg

      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/mei-http.log 2>&1 &
          echo $! >/tmp/mei-http.pid
          sleep 2

      - name: Smoke test
        run: |
          curl --fail --silent http://127.0.0.1:4173/ | grep -q "Mei"
          curl --fail --silent http://127.0.0.1:4173/app.js | grep -q "0.1.0-beta"
